name: Build and Push Docker Image

on:
  workflow_dispatch:

env:
  IMAGE_OWNER: szcq
  IMAGE_NAME: sharelatex
  IMAGE_VERSION: ${{ vars.IMAGE_VERSION }}

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate image version
      shell: bash
      run: |
        if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Set repository variable IMAGE_VERSION to an Ayakaleaf Pro version, e.g. 6.3.2" >&2
          exit 1
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ env.IMAGE_OWNER }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push multi-arch image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        build-args: |
          BASE_IMAGE=ghcr.io/ayaka-notes/overleaf-pro:${{ env.IMAGE_VERSION }}
          TEXLIVE_YEAR=2026
        tags: ${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}

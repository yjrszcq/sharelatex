# =======================================================
#                      Ayakaleaf Pro
# 集成全部 Pro 功能的 Overleaf Community Edition 增强版
# https://github.com/ayaka-notes/ayakaleaf-pro
# =======================================================
# 或者使用 ayakaleaf 官方的 toolkit 部署
# https://github.com/ayaka-notes/toolkit
# 操作与 overleaf-toolkit 一致
# 此外需要修改 overleaf.rc 里的 SERVER_PRO 为 true
# =======================================================
# 如需沙盒编译，请按官方文档另配 TeX Live 编译镜像和宿主路径
# =======================================================

services:
  ayakaleaf:
    image: szcq/sharelatex:6.3.2
    container_name: ayakaleaf
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      git-bridge:
        condition: service_started

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./data/overleaf:/var/lib/overleaf
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      OVERLEAF_APP_NAME: Ayakaleaf Pro
      # OVERLEAF_SITE_LANGUAGE: "zh-CN"
      
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # 必填：放到 .env
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET}

      # 如果套域名反代，改成你的域名
      OVERLEAF_SITE_URL: https://latex.example.com

      EMAIL_CONFIRMATION_DISABLED: "true"
      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"
      ENABLE_CONVERSIONS: "true"

      # AI 功能，若启用则需要填写 BASE_URL / API_KEY / MODEL
      AI_ENABLED: "true"
      AI_BASE_URL: "https://api.example.com/v1"
      AI_API_KEY: "${AI_API_KEY}"
      AI_MODEL: "gpt-6.1-sol"

      # -------------------------
      # Git Bridge
      # -------------------------
      GIT_BRIDGE_ENABLED: "true"
      GIT_BRIDGE_HOST: "git-bridge"
      GIT_BRIDGE_PORT: "8000"

      # Git Bridge 需要访问主容器内的 History Service
      V1_HISTORY_URL: "http://ayakaleaf:3100/api"
      
      # MCP 随 Git integration 启用，无独立开关、额外端口或容器
      # 在 Account Settings 生成 Git token，再从 Integrations → MCP server 取连接地址

    stop_grace_period: 60s


  # -------------------------
  # Git Bridge：版本与主容器保持一致
  # -------------------------
  git-bridge:
    image: ghcr.io/ayaka-notes/overleaf-pro/git-bridge:6.3.2
    container_name: ayakaleaf-git-bridge
    restart: unless-stopped

    volumes:
      - ./data/git-bridge:/data/git-bridge

    expose:
      - "8000"

    environment:
      GIT_BRIDGE_API_BASE_URL: "http://ayakaleaf:3000/api/v0/"
      GIT_BRIDGE_OAUTH2_SERVER: "http://ayakaleaf"
      GIT_BRIDGE_POSTBACK_BASE_URL: "http://git-bridge:8000"
      GIT_BRIDGE_ROOT_DIR: "/data/git-bridge"

    user: root
    command: ["/server-pro-start.sh"]


  mongo:
    image: mongo:8.0
    container_name: ayakaleaf-mongo
    restart: unless-stopped

    # MongoDB 与 Linux 内核不兼容时用
    # environment:
    #   GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    #   MONGO_TCMALLOC_PER_CPU_CACHE_SIZE_BYTES: "0"
      
    command:
      - mongod
      - --replSet
      - overleaf
      - --bind_ip_all

    volumes:
      - ./data/mongo:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  mongo-init:
    image: mongo:8.0
    container_name: ayakaleaf-mongo-init
    restart: "no"

    depends_on:
      mongo:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        mongosh --host mongo:27017 --eval '
          try {
            rs.status()
          } catch (e) {
            rs.initiate({
              _id: "overleaf",
              members: [
                { _id: 0, host: "mongo:27017" }
              ]
            })
          }
        '


  redis:
    image: redis:7.4
    container_name: ayakaleaf-redis
    restart: unless-stopped

    volumes:
      - ./data/redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

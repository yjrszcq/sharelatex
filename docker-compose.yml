# =======================================================
#                      Ayakaleaf Pro
# 集成全部 Pro 功能的 Overleaf Community Edition 增强版
# https://github.com/ayaka-notes/ayakaleaf-pro
# =======================================================
# 或者使用 ayakaleaf 官方的 toolkit 部署
# https://github.com/ayaka-notes/toolkit
# 操作与 overleaf-toolkit 一致
# 此外需要修改 overleaf.rc 里的 SERVER_PRO 为 true
# =======================================================
# 未指定 GIT_BRIDGE_HOST 时使用镜像内置的 Git Bridge
# 如需沙盒编译，请按官方文档另配 TeX Live 编译镜像和宿主路径
# =======================================================

services:
  ayakaleaf:
    image: szcq/sharelatex:6.3.2
    container_name: ayakaleaf
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    ports:
      - ${OVERLEAF_PORT}:80

    volumes:
      - ${OVERLEAF_DATA_PATH}/overleaf:/var/lib/overleaf
      - ${OVERLEAF_DATA_PATH}/git-bridge:/data/git-bridge

    environment:
      OVERLEAF_APP_NAME: Ayakaleaf Pro
      # OVERLEAF_SITE_LANGUAGE: "zh-CN"
      
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # 必填：放到 .env
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET}

      # 如果套域名反代，改成你的域名
      OVERLEAF_SITE_URL: ${OVERLEAF_SITE_URL}

      EMAIL_CONFIRMATION_DISABLED: "true"
      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"
      ENABLE_CONVERSIONS: "true"

      # AI 功能，若启用则需要填写 BASE_URL / API_KEY / MODEL
      AI_ENABLED: "${AI_ENABLED}"
      AI_BASE_URL: "${AI_BASE_URL}"
      AI_API_KEY: "${AI_API_KEY}"
      AI_MODEL: "${AI_MODEL}"

      # Git Bridge
      GIT_BRIDGE_ENABLED: "${GIT_BRIDGE_ENABLED}"
      
      # MCP 随 Git integration 启用，无独立开关、额外端口或容器
      # 在 Account Settings 生成 Git token，再从 Integrations → MCP server 取连接地址

    stop_grace_period: 60s


  mongo:
    image: mongo:8.0
    container_name: ayakaleaf-mongo
    restart: unless-stopped

    # MongoDB 与 Linux 内核不兼容时用
    # environment:
    #   GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    #   MONGO_TCMALLOC_PER_CPU_CACHE_SIZE_BYTES: "0"
      
    command:
      - mongod
      - --replSet
      - overleaf
      - --bind_ip_all

    volumes:
      - ${OVERLEAF_DATA_PATH}/mongo:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  mongo-init:
    image: mongo:8.0
    container_name: ayakaleaf-mongo-init
    restart: "no"

    depends_on:
      mongo:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        mongosh --host mongo:27017 --eval '
          try {
            rs.status()
          } catch (e) {
            rs.initiate({
              _id: "overleaf",
              members: [
                { _id: 0, host: "mongo:27017" }
              ]
            })
          }
        '


  redis:
    image: redis:7.4
    container_name: ayakaleaf-redis
    restart: unless-stopped

    volumes:
      - ${OVERLEAF_DATA_PATH}/redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
